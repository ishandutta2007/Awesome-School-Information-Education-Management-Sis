<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Filters for Glow & Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pill-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-value {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 18px;
      fill: #38bdf8;
    }
    .metric-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
    }

    /* CSS Keyframe Animations */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.1); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-25px, 25px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes barGrow {
      0%, 100% { height: 18px; y: 42px; }
      50% { height: 38px; y: 22px; }
    }
    @keyframes barGrow2 {
      0%, 100% { height: 34px; y: 26px; }
      50% { height: 20px; y: 40px; }
    }
    @keyframes barGrow3 {
      0%, 100% { height: 26px; y: 34px; }
      50% { height: 44px; y: 16px; }
    }

    .orb1 { animation: floatOrb1 10s ease-in-out infinite; }
    .orb2 { animation: floatOrb2 12s ease-in-out infinite; }
    .wave-line { animation: waveFlow 8s ease-in-out infinite; }
    .bar-anim-1 { animation: barGrow 3.5s ease-in-out infinite; }
    .bar-anim-2 { animation: barGrow2 4s ease-in-out infinite 0.5s; }
    .bar-anim-3 { animation: barGrow3 3.8s ease-in-out infinite 1s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Glowing Orbs -->
  <g class="orb1">
    <circle cx="200" cy="80" r="140" fill="url(#glowGrad1)" />
  </g>
  <g class="orb2">
    <circle cx="1020" cy="240" r="160" fill="url(#glowGrad2)" />
  </g>

  <!-- Subtle Blueprint Tech Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Animated Background Wave / Flowlines -->
  <g class="wave-line" opacity="0.35">
    <path d="M -100 280 C 150 210, 380 320, 650 270 C 920 220, 1100 300, 1300 260" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
    <path d="M -100 300 C 180 240, 420 340, 680 290 C 950 240, 1140 320, 1300 280" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,6" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Category Chip -->
  <g transform="translate(60, 45)">
    <rect width="258" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="20" class="tag-text">ACADEMIC EDTECH ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title & Accent Highlight -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" class="title-text">Awesome School Information &amp;</text>
    <text x="0" y="48" class="title-text" fill="url(#accentGrad)">Education Management (SIS)</text>
  </g>

  <!-- Subtitle / Value Prop -->
  <g transform="translate(60, 205)">
    <text x="0" y="0" class="subtitle-text">Curated SaaS &amp; Open-Source Architectures for K-12 Districts, Private Academies &amp; Universities</text>
  </g>

  <!-- Feature Tags / Quick Pillars -->
  <g transform="translate(60, 245)">
    <!-- Pill 1: Admissions -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="pill-label">🎓 Admissions</text>
    </g>
    <!-- Pill 2: Grading -->
    <g transform="translate(145, 0)">
      <rect width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="pill-label">📊 Gradebooks</text>
    </g>
    <!-- Pill 3: Attendance -->
    <g transform="translate(285, 0)">
      <rect width="140" height="34" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="pill-label">📅 Attendance</text>
    </g>
    <!-- Pill 4: Portals -->
    <g transform="translate(435, 0)">
      <rect width="155" height="34" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="pill-label">👨‍👩‍👧 Parent Portals</text>
    </g>
    <!-- Pill 5: Open-Source & Cloud -->
    <g transform="translate(600, 0)">
      <rect width="165" height="34" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="pill-label">⚡ Self-Hosted / SaaS</text>
    </g>
  </g>

  <!-- Right-Hand Metric / Visual Dashboard Card (Foreground) -->
  <g transform="translate(930, 65)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="210" height="230" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />

    <!-- Card Header -->
    <text x="18" y="32" class="tag-text" font-size="12">MARKET PULSE</text>
    <line x1="18" y1="42" x2="192" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Metric 1: Market Size -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" class="metric-value">$13.5B+</text>
      <text x="0" y="16" class="metric-sub">Global Market Valuation</text>
    </g>

    <!-- Metric 2: Open Source Stars -->
    <g transform="translate(18, 114)">
      <text x="0" y="0" class="metric-value" fill="#818cf8">15+ Platforms</text>
      <text x="0" y="16" class="metric-sub">SaaS &amp; FLOSS Solutions</text>
    </g>

    <!-- Mini Live Activity Indicator / Bars -->
    <g transform="translate(18, 155)">
      <rect width="174" height="50" rx="8" fill="#1e293b" fill-opacity="0.6" />
      <text x="12" y="30" class="tag-text" font-size="11" fill="#94a3b8">K-12 &amp; Higher Ed</text>

      <!-- Animated Activity Equalizer Bars -->
      <g transform="translate(118, 0)">
        <rect class="bar-anim-1" x="0" y="28" width="6" height="20" rx="3" fill="#38bdf8" />
        <rect class="bar-anim-2" x="10" y="22" width="6" height="26" rx="3" fill="#818cf8" />
        <rect class="bar-anim-3" x="20" y="18" width="6" height="30" rx="3" fill="#c084fc" />
        <rect class="bar-anim-1" x="30" y="24" width="6" height="24" rx="3" fill="#38bdf8" />
      </g>
    </g>
  </g>
</svg>
